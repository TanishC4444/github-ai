[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-ai-runner"
version = "0.3.1"
description = "CI-native, resource-aware AI workloads on ephemeral GitHub Actions runners"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Tanish Chauhan" }]
keywords = ["ai", "llm", "inference", "github-actions", "llama", "serverless"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28", "PyNaCl>=1.5"]

[project.urls]
Homepage = "https://github.com/TanishC4444/github-ai"
Repository = "https://github.com/TanishC4444/github-ai"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gh_ai_runner*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"]
